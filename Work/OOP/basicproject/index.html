<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Test Scores Form</title>
    <link rel="stylesheet" href="examstyle.css">
</head>
<body>
    <div id="div1">
        <h1>Student Exam Scores</h1>
    <form action="examprocess.html" method="get">
        <div id="div2">
        <table>
            <br>
           <tr>
            <td><p id="inputtitle"><i><b>Name</b></i></p></td>
            <td><input type="text" name="names" placeholder="INPUT NAMES" required></td>
           </tr>
           <tr>
            <td><p id="inputtitle"><i><b>Subject</b></i><p></td>
            <td><input type="text" name="subject" placeholder="INPUT SUBJECTS" required></td>
           </tr>
           <tr>
            <td><p id="inputtitle"><i><b>Score</b></i></p></td>
            <td><input type="number" name="score" placeholder="INPUT SCORES" required></td>
           </tr>
           <tr>
            <td><button type="submit">SUBMIT</button></td>
            <td><button type="reset">RESET</button></td>
           </tr>
        </table>

        <a href="https://ryazel.github.io/AKPortfolio" target="_blank">
        <img id="RAT" src="asset/spinning-rat.gif" alt="RAT" width="100" height="100" 
        style="border: 2px darkblue solid; box-shadow: 2px 2px 0px cyan;">
        </a>

        </div>
    </form>
    </div> 
</body>
</html>
