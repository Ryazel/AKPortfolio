<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioshock</title>
    <style>
        th {
            text-align: left;
        }

        h1 {
            background-color: lightgrey;
            border-top: 2px darkblue solid;
            border-bottom: 2px darkblue solid;
            text-shadow: 0px 2px 2px gray;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Havard Shocking Bio Application</h1>
    <p style="text-align: center;"><strong>This file is originally a PHP</strong>, <u>Changed to html to work in github.io</u></p>
    <center>
        <table border="40">
            <tr>
                <th>NIS</th>
                <th>Name</th>
                <th>Birth Date</th>
                <th>Gender</th>
                <th>Major</th>
                <th>Email</th>
                <th>Height</th>
                <th>Extra</th>
                <th>Address</th>
            </tr>
            <tr>
                <th id="BioNIS"></th>
                <th id="BioName"></th>
                <th id="BioDate"></th>
                <th id="BioGender"></th>
                <th id="BioMajor"></th>
                <th id="BioEmail"></th>
                <th id="BioHeight"></th>
                <th id="BioExtra"></th>
                <th id="BioAddress"></th>
            </tr>
        </table>
    </center>
    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById("BioNIS").textContent = params.get("BioNIS") || "";
        document.getElementById("BioName").textContent = params.get("BioName") || "";
        document.getElementById("BioDate").textContent = params.get("BioDate") || "";
        document.getElementById("BioGender").textContent = params.get("BioGender") || "";
        document.getElementById("BioMajor").textContent = params.get("BioMajor") || "";
        document.getElementById("BioEmail").textContent = params.get("BioEmail") || "";
        document.getElementById("BioHeight").textContent = params.get("BioHeight") || "";
        document.getElementById("BioExtra").textContent = params.getAll("BioExtra").join(", ");
        document.getElementById("BioAddress").textContent = params.get("BioAddress") || "";
    </script>
</body>
</html>
